name: Update market signals

on:
  schedule:
    - cron: "15 22 * * 1-5"   # weekdays, after the US close (6:15pm ET summer / 5:15pm ET winter)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-signals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Fetch data, score, alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_MIN_SEVERITY: ${{ vars.ALERT_MIN_SEVERITY }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: python -m engine.run

      - name: Commit updated data
        run: |
          git config user.name "market-signals-bot"
          git config user.email "market-signals-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update market signals $(date -u +%Y-%m-%d)"
            git push
          fi
