name: Update market signals

on:
  schedule:
    - cron: "0 15 * * 1-5"    # 11:00am ET midday run while daylight saving time is in effect
    - cron: "0 16 * * 1-5"    # 11:00am ET midday run during standard time
    - cron: "15 22 * * 1-5"   # weekdays, after the US close (6:15pm ET summer / 5:15pm ET winter)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-signals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # GitHub cron is UTC-only: two midday triggers exist, and only the one matching
      # 11am in New York for the current season (EDT -0400 / EST -0500) proceeds.
      - name: Check midday run matches 11am Eastern
        id: gate
        run: |
          offset=$(TZ=America/New_York date +%z)
          run=true
          if [ "${{ github.event.schedule }}" = "0 15 * * 1-5" ] && [ "$offset" != "-0400" ]; then run=false; fi
          if [ "${{ github.event.schedule }}" = "0 16 * * 1-5" ] && [ "$offset" != "-0500" ]; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Eastern offset $offset, schedule '${{ github.event.schedule }}', run=$run"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Unit tests
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests

      - name: Fetch data, score, alert
        if: steps.gate.outputs.run == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_MIN_SEVERITY: ${{ vars.ALERT_MIN_SEVERITY }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: python -m engine.run

      - name: Commit updated data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "market-signals-bot"
          git config user.email "market-signals-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update market signals $(date -u +%Y-%m-%d)"
            git push
          fi
